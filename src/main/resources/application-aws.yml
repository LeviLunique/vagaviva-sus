# Perfil usado nas tasks ECS (hml/prod). Logs em JSON para o CloudWatch Logs Insights.
logging:
  structured:
    format:
      console: ecs
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
# Produção: documentação interativa e contrato desligados (superfície de ataque menor).
# Os perfis de apresentação/homologação ("aws,demo") religam em application-demo.yml.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
