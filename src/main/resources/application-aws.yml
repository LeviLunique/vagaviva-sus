# Perfil base de nuvem (produção real — desenho em docs/capacity-planning.md — e, combinado com "demo", o
# ambiente de demonstração). Logs em JSON para o CloudWatch Logs Insights.
logging:
  structured:
    format:
      console: ecs
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
# Produção: documentação interativa e contrato desligados (superfície de ataque menor).
# O ambiente de demonstração ("aws,demo") religa em application-demo.yml.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
