spring:
  jpa:
    show-sql: false
logging:
  level:
    root: WARN
    br.com.vagaviva: INFO
vagaviva:
  public-base-url: https://vagaviva.test
  security:
    bootstrap-admin:
      email: admin@vagaviva.test
      password: Admin@Test2026
  demo:
    users-password: Demo@Test2026
  regulation:
    # Nos testes o snapshot é chamado explicitamente; o job não dispara sozinho.
    queue-snapshot-interval: PT1H
    queue-snapshot-initial-delay: PT1H
  scheduling:
    # Nos testes a alocação é chamada explicitamente (ou pelo evento de publicação).
    allocation-interval: PT1H
    allocation-initial-delay: PT1H
